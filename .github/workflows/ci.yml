name: Java 21
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verification:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests et paquet (Linux)
        if: runner.os == 'Linux'
        run: ./mvnw --batch-mode verify javadoc:javadoc
      - name: Tests et paquet (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd --batch-mode verify javadoc:javadoc
